[project]
name = "pairfect"
version = "0.1.0"
description = "Exhaustive search for the best pair of Wordle opening words"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numba>=0.67.0",
    "numpy>=2.5.3",
]

[project.scripts]
pairfect = "pairfect:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
